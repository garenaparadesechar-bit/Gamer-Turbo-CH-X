    compileSdk 35

    defaultConfig {
        applicationId 'com.ch.gamerturbox'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '2.0'
        multiDexEnabled false
    }
}


dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
